<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلب تسجيل عضوية — هيئة محبي الحسين</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef2ef;color:#17352b;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:680px;margin:auto;padding:18px}.head{background:#123028;color:#fff;border-radius:18px;padding:25px;text-align:center;border-bottom:5px solid #c19a3e}.head h1{margin:0 0 8px;font-size:24px}.head p{margin:0;color:#e7dcc5}.card{background:#fff;border-radius:18px;padding:20px;margin-top:15px;box-shadow:0 8px 30px #12302814}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input,select,textarea{width:100%;padding:12px;border:1px solid #cad5ce;border-radius:10px;font:inherit;background:#fff}textarea{resize:vertical;min-height:90px}.phone{display:flex;gap:7px}.phone select{width:145px}.btn{width:100%;border:0;border-radius:11px;padding:14px;background:#123028;color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer}.btn:disabled{opacity:.55}.msg{text-align:center;padding:24px;line-height:1.9}.ok{color:#177245}.err{color:#b42318}.note{font-size:12px;color:#6d7d74;line-height:1.7}.hint{font-size:11px;color:#718078;font-weight:400;margin-top:5px}.photo-row{display:flex;align-items:center;gap:13px}.photo-preview{width:82px;height:82px;border-radius:50%;background:#edf2ef;border:2px dashed #aebdb5;display:grid;place-items:center;overflow:hidden;color:#718078;flex:0 0 auto}.photo-preview img{width:100%;height:100%;object-fit:cover}.photo-row input{flex:1}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.head h1{font-size:21px}.phone{flex-direction:column}.phone select{width:100%}}</style></head>
<body><div class="wrap"><div class="head"><h1>طلب تسجيل عضوية</h1><p>هيئة محبي الحسين (ع) — بني جمرة</p></div><div class="card" id="app"><div class="msg">جارٍ التحقق من حالة التسجيل…</div></div></div>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore-compat.js"></script><script>
const FB={apiKey:"AIzaSyBlAxijaUz0OHwCsq5NnvQ90OVOCsr1vKY",authDomain:"haiaa-banijamrah.firebaseapp.com",projectId:"haiaa-banijamrah",storageBucket:"haiaa-banijamrah.firebasestorage.app",messagingSenderId:"499603171369",appId:"1:499603171369:web:19c71e92ca2690cfe61438"};let db,photoData='';
function form(){document.getElementById('app').innerHTML=`<form id="regForm"><div class="grid"><div class="full"><label>الاسم (الاسم الثلاثي) *</label><input name="name" required maxlength="120" autocomplete="name" placeholder="مثال: صادق منير محمد علي الغسرة"><div class="hint">يرجى كتابة الاسم الثلاثي كاملًا.</div></div><div><label>رقم الهاتف *</label><div class="phone"><select name="code"><option value="973">البحرين +973</option><option value="966">السعودية +966</option><option value="965">الكويت +965</option><option value="971">الإمارات +971</option><option value="974">قطر +974</option><option value="968">عُمان +968</option></select><input name="phone" required inputmode="numeric" maxlength="12" pattern="[0-9]+" placeholder="اكتب الرقم بالإنجليزية"></div><div class="hint">مهم: اكتب رقم الهاتف بالأرقام الإنجليزية 0–9.</div></div><div><label>المنطقة</label><input name="area" maxlength="100"></div><div><label>البريد الإلكتروني</label><input type="email" name="email" maxlength="160"></div><div><label>نوع العضوية المقترح</label><select name="type"><option>عادي</option><option>شرفي</option><option>كادر</option></select></div><div class="full"><label>العنوان</label><input name="address" maxlength="220"></div><div class="full"><label>الصورة الشخصية <span style="font-weight:400">(اختياري)</span></label><div class="photo-row"><div class="photo-preview" id="photoPreview">صورة</div><input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp" onchange="selectPhoto(event)"></div><div class="hint">تُضغط الصورة تلقائيًا قبل الإرسال. الحد الأقصى للملف الأصلي 8 MB.</div></div><div><label>هل عمر المتقدم أقل من 18 سنة؟</label><select name="minor" onchange="document.getElementById('birthWrap').style.display=this.value==='yes'?'block':'none'"><option value="no">لا</option><option value="yes">نعم</option></select></div><div id="birthWrap" style="display:none"><label>تاريخ الميلاد</label><input type="date" name="birthdate"></div><div class="full"><label>ملاحظات</label><textarea name="notes" maxlength="1000"></textarea></div><div class="full"><label style="font-weight:400"><input type="checkbox" name="consent" required style="width:auto;margin-left:6px">أقر بصحة البيانات وأوافق على استخدامها لغرض مراجعة طلب العضوية.</label></div><div class="full"><button class="btn" id="send">إرسال طلب التسجيل</button><div class="note" style="margin-top:9px">إرسال الطلب لا يعني قبول العضوية. ستراجعه إدارة الهيئة وتتواصل معك بعد اعتماده.</div></div></div></form>`;document.getElementById('regForm').onsubmit=submit}
function selectPhoto(e){const file=e.target.files&&e.target.files[0];if(!file){photoData='';return}if(file.size>8*1024*1024){alert('الصورة أكبر من 8 MB');e.target.value='';return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const make=(size,quality)=>{const scale=Math.min(1,size/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);return c.toDataURL('image/jpeg',quality)};photoData=make(480,.72);if(photoData.length>340000)photoData=make(400,.52);if(photoData.length>340000)photoData=make(300,.42);document.getElementById('photoPreview').innerHTML=`<img src="${photoData}" alt="معاينة الصورة">`};img.onerror=()=>alert('تعذّر قراءة الصورة');img.src=reader.result};reader.readAsDataURL(file)}
async function submit(e){e.preventDefault();const b=document.getElementById('send');b.disabled=true;b.textContent='جارٍ الإرسال…';const f=new FormData(e.target),raw=String(f.get('phone')||'');if(!/^[0-9]+$/.test(raw)){alert('اكتب رقم الهاتف بالأرقام الإنجليزية فقط');b.disabled=false;b.textContent='إرسال طلب التسجيل';return}const digits=raw.replace(/\D/g,'');if(digits.length<7){alert('تحقق من رقم الهاتف');b.disabled=false;b.textContent='إرسال طلب التسجيل';return}const data={name:String(f.get('name')||'').trim(),phone:'+'+f.get('code')+digits,area:String(f.get('area')||'').trim(),email:String(f.get('email')||'').trim(),address:String(f.get('address')||'').trim(),type:String(f.get('type')||'عادي'),isMinor:f.get('minor')==='yes',birthdate:String(f.get('birthdate')||''),notes:String(f.get('notes')||'').trim(),photoData:photoData||'',status:'pending',createdAt:new Date().toISOString(),source:'public-registration'};try{await db.collection('membershipRequests').add(data);document.getElementById('app').innerHTML='<div class="msg ok"><h2>تم إرسال طلبك بنجاح</h2><p>ستراجع إدارة الهيئة البيانات وتتواصل معك بعد اتخاذ القرار.</p></div>'}catch(err){console.error(err);b.disabled=false;b.textContent='إرسال طلب التسجيل';alert('تعذّر إرسال الطلب. حاول مرة أخرى.')}}
(async()=>{try{firebase.initializeApp(FB);db=firebase.firestore();const d=await db.collection('publicSettings').doc('registration').get();if(d.exists&&d.data().enabled===true)form();else document.getElementById('app').innerHTML='<div class="msg"><h2>التسجيل مغلق حاليًا</h2><p>سيُفتح رابط التسجيل عند بدء استقبال الطلبات.</p></div>'}catch(e){document.getElementById('app').innerHTML='<div class="msg err">تعذّر الاتصال. تحقق من الإنترنت ثم أعد المحاولة.</div>'}})();
</script></body></html>
