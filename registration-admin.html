<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة تسجيل العضوية</title>
<style>:root{--g:#123028;--gold:#c19a3e;--bg:#eef2ef;--muted:#6b7c73;--red:#b42318;--blue:#175cd3;--green:#177245}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17352b;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--g);color:white;padding:18px;border-radius:16px;border-bottom:5px solid var(--gold);flex-wrap:wrap}.top h1{font-size:22px;margin:0}.top p{margin:5px 0 0;color:#dbe7e1;font-size:13px}.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--g);color:white}.btn.light{background:white;color:var(--g)}.btn.gold{background:var(--gold);color:var(--g)}.btn.red{background:#fff0ee;color:var(--red);border:1px solid #f2b8b2}.btn.ghost{background:#edf3f0;color:var(--g)}.panel{background:white;border-radius:16px;padding:18px;margin-top:15px;box-shadow:0 6px 24px #12302810}.switch-box{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px;border:2px solid #d8e2dd;border-radius:14px}.switch-box.open{border-color:#78c59b;background:#effaf4}.switch-box.closed{border-color:#efafa9;background:#fff5f4}.state{font-size:19px;font-weight:800}.state small{font-size:12px;font-weight:400;display:block;color:var(--muted);margin-top:4px}.toggle{min-width:150px;font-size:15px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:white;border-radius:15px;padding:16px;border-top:4px solid var(--g);box-shadow:0 5px 18px #1230280d}.stat b{display:block;font-size:28px}.stat span{color:var(--muted);font-size:13px}.stat.pending{border-color:var(--gold)}.stat.approved{border-color:var(--green)}.stat.rejected{border-color:var(--red)}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button.active{background:var(--g);color:#fff}.list{display:grid;gap:12px;margin-top:14px}.request{border:1px solid #d9e2dd;border-radius:14px;padding:15px;display:grid;grid-template-columns:auto 1fr;gap:14px}.avatar{width:74px;height:74px;border-radius:50%;background:#edf2ef;display:grid;place-items:center;overflow:hidden;color:var(--muted)}.avatar img{width:100%;height:100%;object-fit:cover}.head{display:flex;justify-content:space-between;gap:10px;align-items:start}.head h3{margin:0;font-size:17px}.name-note{font-size:11px;font-weight:400;color:var(--muted);display:block;margin-bottom:3px}.badge{padding:5px 9px;border-radius:20px;font-size:11px;background:#fff3cf;color:#765700}.badge.approved{background:#e7f7ed;color:var(--green)}.badge.rejected{background:#fdebea;color:var(--red)}.meta{font-size:13px;line-height:1.9;color:#51645a;margin-top:7px}.notes{background:#f5f8f6;padding:9px;border-radius:8px;margin-top:7px;white-space:pre-wrap}.empty{text-align:center;padding:30px;color:var(--muted)}.login{max-width:430px;margin:80px auto}.login input{width:100%;padding:12px;border:1px solid #cbd8d1;border-radius:9px;margin:6px 0;font:inherit}.login .btn{width:100%;margin-top:8px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.request{grid-template-columns:1fr}.avatar{width:62px;height:62px}.switch-box{align-items:stretch;flex-direction:column}.toggle{width:100%}.top h1{font-size:19px}}</style></head>
<body><div class="wrap"><div class="top"><div><h1>إدارة رابط تسجيل العضوية</h1><p>الإحصائيات، الطلبات، الاعتماد والحذف</p></div><div class="actions"><button class="btn light" onclick="window.close();setTimeout(()=>location.href='index.html#settings',150)">← الإعدادات</button><button class="btn gold" onclick="window.open('register.html','_blank')">معاينة الاستمارة</button></div></div><div id="app"><div class="panel empty">جارٍ التحقق من صلاحية الدخول…</div></div></div>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore-compat.js"></script><script>
const FB={apiKey:"AIzaSyBlAxijaUz0OHwCsq5NnvQ90OVOCsr1vKY",authDomain:"haiaa-banijamrah.firebaseapp.com",projectId:"haiaa-banijamrah",storageBucket:"haiaa-banijamrah.firebasestorage.app",messagingSenderId:"499603171369",appId:"1:499603171369:web:19c71e92ca2690cfe61438"};firebase.initializeApp(FB);const db=firebase.firestore(),auth=firebase.auth();let rows=[],filter='all',enabled=false;const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function login(){document.getElementById('app').innerHTML=`<div class="panel login"><h2>دخول الإدارة</h2><p>استخدم نفس حساب إدارة الموقع.</p><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="pass" type="password" placeholder="كلمة المرور"><button class="btn" onclick="signIn()">دخول</button><div id="err" style="color:var(--red);margin-top:8px"></div></div>`}async function signIn(){try{await auth.signInWithEmailAndPassword(document.getElementById('email').value.trim(),document.getElementById('pass').value)}catch(e){document.getElementById('err').textContent='البريد أو كلمة المرور غير صحيحة'}}
async function load(){document.getElementById('app').innerHTML='<div class="panel empty">جارٍ تحميل الطلبات…</div>';const [setting,snap]=await Promise.all([db.collection('publicSettings').doc('registration').get(),db.collection('membershipRequests').get()]);enabled=setting.exists&&setting.data().enabled===true;rows=snap.docs.map(d=>({_id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));render()}
function render(){const total=rows.length,pending=rows.filter(x=>!x.status||x.status==='pending').length,approved=rows.filter(x=>x.status==='approved').length,rejected=rows.filter(x=>x.status==='rejected').length;document.getElementById('app').innerHTML=`<div class="panel"><div class="switch-box ${enabled?'open':'closed'}"><div class="state">${enabled?'● التسجيل مفتوح':'● التسجيل مغلق'}<small>${enabled?'يمكن للأشخاص إرسال طلبات جديدة الآن':'لن يتمكن أي شخص من إرسال طلب جديد'}</small></div><button class="btn toggle ${enabled?'red':'gold'}" onclick="toggleRegistration()">${enabled?'إغلاق رابط التسجيل':'فتح رابط التسجيل'}</button></div><div class="actions"><button class="btn" onclick="copyLink()">نسخ رابط التسجيل</button><button class="btn ghost" onclick="window.open('register.html','_blank')">معاينة الرابط</button><button class="btn ghost" onclick="load()">تحديث البيانات</button></div></div><div class="stats"><div class="stat"><b>${total}</b><span>إجمالي المسجلين</span></div><div class="stat pending"><b>${pending}</b><span>قيد المراجعة</span></div><div class="stat approved"><b>${approved}</b><span>المقبولون</span></div><div class="stat rejected"><b>${rejected}</b><span>المرفوضون</span></div></div><div class="panel"><div class="filters"><button class="btn ghost ${filter==='all'?'active':''}" onclick="setFilter('all')">الكل</button><button class="btn ghost ${filter==='pending'?'active':''}" onclick="setFilter('pending')">قيد المراجعة</button><button class="btn ghost ${filter==='approved'?'active':''}" onclick="setFilter('approved')">المقبولون</button><button class="btn ghost ${filter==='rejected'?'active':''}" onclick="setFilter('rejected')">المرفوضون</button></div><div class="list">${requestList()}</div></div>`}
function requestList(){const list=rows.filter(x=>filter==='all'||(filter==='pending'?(!x.status||x.status==='pending'):x.status===filter));if(!list.length)return '<div class="empty">لا توجد طلبات في هذه القائمة.</div>';return list.map(r=>{const status=r.status==='approved'?'مقبول':r.status==='rejected'?'مرفوض':'قيد المراجعة',klass=r.status==='approved'?'approved':r.status==='rejected'?'rejected':'';return `<div class="request"><div class="avatar">${r.photoData?`<img src="${r.photoData}" alt="">`:'بدون صورة'}</div><div><div class="head"><h3><span class="name-note">الاسم (الاسم الثلاثي)</span>${esc(r.name||'—')}</h3><span class="badge ${klass}">${status}</span></div><div class="meta"><span dir="ltr">${esc(r.phone||'—')}</span> · ${esc(r.area||'المنطقة غير محددة')} · ${esc(r.type||'عادي')}<br>${esc(r.email||'')}${r.address?`<br>${esc(r.address)}`:''}${r.memberCode?`<br>رقم العضوية: ${esc(r.memberCode)}`:''}</div>${r.notes?`<div class="notes">${esc(r.notes)}</div>`:''}<div class="actions"><button class="btn ghost" onclick="printRequest('${r._id}')">طباعة PDF</button>${(!r.status||r.status==='pending')?`<button class="btn" onclick="approve('${r._id}')">استكمال واعتماد العضوية</button><button class="btn red" onclick="reject('${r._id}')">رفض</button>`:''}${(r.status==='approved'||r.status==='rejected')?`<button class="btn red" onclick="removeRequest('${r._id}')">حذف السجل</button>`:''}</div></div></div>`}).join('')}
function setFilter(v){filter=v;render()}async function toggleRegistration(){const next=!enabled;if(!confirm(next?'فتح رابط التسجيل واستقبال الطلبات؟':'إغلاق رابط التسجيل؟'))return;await db.collection('publicSettings').doc('registration').set({enabled:next,updatedAt:new Date().toISOString()},{merge:true});enabled=next;render()}async function copyLink(){const url=new URL('register.html',location.href).href;try{await navigator.clipboard.writeText(url);alert('تم نسخ رابط التسجيل')}catch(e){prompt('انسخ الرابط:',url)}}function approve(id){location.href='index.html?registrationRequest='+encodeURIComponent(id)}async function reject(id){if(!confirm('رفض هذا الطلب؟'))return;await db.collection('membershipRequests').doc(id).update({status:'rejected',rejectedAt:new Date().toISOString(),updatedAt:new Date().toISOString()});await load()}async function removeRequest(id){const r=rows.find(x=>x._id===id);if(!r||!['approved','rejected'].includes(r.status)){alert('لا يمكن حذف طلب ما زال قيد المراجعة');return}if(!confirm('حذف هذا السجل نهائيًا؟ لا يمكن التراجع.'))return;await db.collection('membershipRequests').doc(id).delete();await load()}
function printRequest(id){const r=rows.find(x=>x._id===id);if(!r)return;const w=window.open('','_blank');const row=(a,b)=>`<tr><th>${a}</th><td>${esc(b||'—')}</td></tr>`;w.document.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>طلب تسجيل عضوية</title><style>@page{size:A4;margin:18mm}body{font-family:Tahoma,Arial;color:#17352b}.head{text-align:center;border-bottom:3px double #c19a3e;padding:15px}.photo{width:90px;height:90px;border-radius:50%;object-fit:cover}table{width:100%;border-collapse:collapse;margin-top:22px}th,td{border:1px solid #d8dfdb;padding:11px;text-align:right}th{width:32%;background:#eef5f1}@media print{button{display:none}}</style></head><body><button onclick="print()">طباعة / حفظ PDF</button><div class="head">${r.photoData?`<img class="photo" src="${r.photoData}">`:''}<h2>استمارة طلب تسجيل عضوية</h2></div><table>${row('الاسم الثلاثي',r.name)}${row('الهاتف',r.phone)}${row('المنطقة',r.area)}${row('البريد',r.email)}${row('العنوان',r.address)}${row('نوع العضوية',r.type)}${row('تاريخ الميلاد',r.birthdate)}${row('الملاحظات',r.notes)}${row('الحالة',r.status==='approved'?'مقبول':r.status==='rejected'?'مرفوض':'قيد المراجعة')}</table></body></html>`);w.document.close()}
auth.onAuthStateChanged(u=>u?load().catch(e=>{document.getElementById('app').innerHTML='<div class="panel empty">تعذّر تحميل البيانات. تحقق من صلاحيات الحساب.</div>';console.error(e)}):login());
</script></body></html>
