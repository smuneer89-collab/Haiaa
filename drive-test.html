<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار الاتصال بـ Google Drive</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:#f4efe6;color:#1a2620;padding:18px;margin:0;}
.wrap{max-width:560px;margin:0 auto;}
h1{font-size:19px;color:#1c4536;text-align:center;margin-bottom:6px;}
.sub{text-align:center;font-size:12.5px;color:#8a7c6b;margin-bottom:18px;}
.card{background:#fffdf8;border:1px solid #e6ddcb;border-radius:14px;padding:16px;margin-bottom:12px;}
button{width:100%;padding:14px;border:none;border-radius:11px;background:#1c4536;color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
.res{margin-top:14px;font-size:13.5px;line-height:1.9;}
.ok{color:#2f8f5b;font-weight:700;}
.bad{color:#b85c5c;font-weight:700;}
.item{padding:7px 0;border-bottom:1px dashed #e6ddcb;}
.item:last-child{border-bottom:none;}
.hint{background:#fbf0e6;border:1px solid #e0b088;border-radius:10px;padding:12px;font-size:12.5px;color:#8a5a2a;line-height:1.8;margin-top:12px;}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:10px;}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid #e6ddcb;}
code{background:#f4efe6;padding:2px 6px;border-radius:4px;font-size:11.5px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔌 اختبار الاتصال بـ Google Drive</h1>
  <div class="sub">افتح هذه الصفحة قبل رفع الموقع للتأكد من عمل المفتاح</div>

  <div class="card">
    <button onclick="runTest()">▶️ ابدأ الاختبار</button>
    <div class="res" id="res"></div>
  </div>
</div>

<script>
const KEY='AIzaSyDEmgbVxhtW7Bb7sWnjA88sq0ZidIKrqQU';
const ROOT='1zNOLTMmQqWJ_kheUHZpvJAWCLXGnyo-C';
const R=document.getElementById('res');
function log(h){ R.innerHTML+=h; }
async function q(query,fields){
  const url=`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&key=${KEY}&fields=${encodeURIComponent(fields)}&pageSize=100&orderBy=name`;
  const r=await fetch(url);
  if(!r.ok){ let m='خطأ '+r.status; try{const j=await r.json(); if(j.error?.message) m=j.error.message;}catch(e){} throw new Error(m); }
  return (await r.json()).files||[];
}
async function runTest(){
  R.innerHTML='⏳ جارٍ الاختبار…<br>';
  try{
    // 1) الفئات
    const cats=await q(`'${ROOT}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`,'files(id,name)');
    log(`<div class="ok">✅ الاتصال ناجح — وُجد ${cats.length} مجلد:</div>`);
    cats.forEach(c=>log(`<div class="item">📁 ${c.name}</div>`));
    if(!cats.length){ log('<div class="hint">المجلد فارغ أو غير مشارَك. تأكد من المشاركة: «أي شخص لديه الرابط».</div>'); return; }

    // 2) أول فئة → الأشخاص
    const first=cats[0];
    const people=await q(`'${first.id}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`,'files(id,name)');
    log(`<div class="ok" style="margin-top:12px">📂 داخل «${first.name}»: ${people.length} مجلد</div>`);
    people.slice(0,8).forEach(p=>log(`<div class="item">👤 ${p.name}</div>`));

    // 3) أول شخص → الصور
    if(people.length){
      const imgs=await q(`'${people[0].id}' in parents and mimeType contains 'image/' and trashed=false`,'files(id,name,thumbnailLink)');
      log(`<div class="ok" style="margin-top:12px">🖼️ صور «${people[0].name}»: ${imgs.length}</div>`);
      if(imgs.length){
        log('<div class="thumbs">'+imgs.slice(0,6).map(f=>{
          const t=f.thumbnailLink?f.thumbnailLink.replace(/=s\d+$/,'=s300'):`https://drive.google.com/thumbnail?id=${f.id}&sz=w300`;
          return `<img src="${t}" onerror="this.src='https://drive.google.com/thumbnail?id=${f.id}&sz=w300'">`;
        }).join('')+'</div>');
        log('<div class="hint">إذا ظهرت الصور المصغّرة أعلاه ✅ فكل شيء جاهز — ارفع الموقع.</div>');
      } else {
        log('<div class="hint">لا صور في هذا المجلد. أضف صوراً في الدرايف وأعد الاختبار.</div>');
      }
    }
  }catch(e){
    log(`<div class="bad">❌ فشل الاتصال</div><div class="item">${e.message}</div>`);
    let hint='';
    if(/API key not valid|API_KEY_INVALID/i.test(e.message)) hint='المفتاح غير صحيح — تأكد من نسخه كاملاً.';
    else if(/not been used|disabled|SERVICE_DISABLED/i.test(e.message)) hint='خدمة Drive API غير مفعّلة في المشروع، أو انتظر دقيقتين بعد التفعيل.';
    else if(/File not found|404/i.test(e.message)) hint='المجلد غير مشارَك. افتح الدرايف → مشاركة → «أي شخص لديه الرابط» → عارض.';
    else if(/blocked|referer|403/i.test(e.message)) hint='المفتاح مقيّد على مواقع معيّنة. غيّر Application restrictions إلى None مؤقتاً.';
    else hint='تحقّق من الاتصال بالإنترنت وأعد المحاولة.';
    log(`<div class="hint">💡 ${hint}</div>`);
  }
}
</script>
</body>
</html>
