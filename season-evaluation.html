<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>تقييم الموسم العام — هيئة محبي الحسين</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#f4efe6;--surface:#fffdf8;--ink:#1a2620;--muted:#817564;--line:#e6ddcb;--accent:#1c4536;--gold:#c19a3e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.head{background:linear-gradient(145deg,#123028,#1c4536);color:#fff;padding:25px 20px;border-radius:18px;text-align:center;border-bottom:3px solid var(--gold);margin-bottom:14px}.head small{color:#e5c875}.head h1{margin:7px 0 2px;font-size:23px}.card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:17px;margin-bottom:12px}.sec{font-weight:800;color:var(--accent);font-size:17px;margin-bottom:12px}.q{padding:13px 0;border-bottom:1px dashed var(--line)}.q:last-child{border:0}.q label{display:block;font-weight:600;margin-bottom:8px}.stars{display:flex;gap:7px;flex-wrap:wrap}.stars label{margin:0}.stars input{display:none}.stars span,.choice label{display:inline-block;border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:#fff;cursor:pointer}.stars input:checked+span,.choice input:checked+span{background:var(--accent);color:#fff;border-color:var(--accent)}.choice{display:flex;gap:7px;flex-wrap:wrap}.choice input{display:none}input[type=text],input[type=number],textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;background:#fff}textarea{min-height:85px;resize:vertical}.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px}.checks label{border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff;font-weight:500}.submit{width:100%;border:0;border-radius:12px;padding:14px;background:var(--accent);color:#fff;font:700 16px inherit;cursor:pointer}.hint{font-size:12px;color:var(--muted)}.state{text-align:center;padding:60px 20px}.state .ic{font-size:44px}@media(max-width:520px){.wrap{padding:10px}.checks{grid-template-columns:1fr}.head h1{font-size:20px}}
</style></head><body><div class="wrap" id="app"><div class="state">جارٍ التحميل…</div></div>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore-compat.js"></script><script>
const FB_CONFIG={apiKey:"AIzaSyBlAxijaUz0OHwCsq5NnvQ90OVOCsr1vKY",authDomain:"haiaa-banijamrah.firebaseapp.com",projectId:"haiaa-banijamrah",storageBucket:"haiaa-banijamrah.firebasestorage.app",messagingSenderId:"499603171369",appId:"1:499603171369:web:19c71e92ca2690cfe61438"};
const RADOODS=['عيسى هارون','ياسر كمال','حسين جعفر','قاسم الحداد','صادق الدمستاني','حسن القصاب','فاضل علوان','هاشم زهير','سيد جعفر الخرداوي','جعفر الجدحفصي'];let db,session,id;
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function state(i,t,m){app.innerHTML=`<div class="state"><div class="ic">${i}</div><h2>${t}</h2><p>${m}</p></div>`}function rate(name,q){return `<div class="q"><label>${q}</label><div class="stars">${['سيء','جيد','ممتاز'].map(v=>`<label><input type="radio" name="${name}" value="${v}"><span>${v}</span></label>`).join('')}</div></div>`}function txt(name,q){return `<div class="q"><label>${q}</label><textarea name="${name}"></textarea></div>`}function yesno(name,q){return `<div class="q"><label>${q}</label><div class="choice"><label><input type="radio" name="${name}" value="نعم"><span>نعم</span></label><label><input type="radio" name="${name}" value="لا"><span>لا</span></label></div></div>`}
function render(){app.innerHTML=`<div class="head"><small>هيئة محبي الحسين (ع) · لجنة العزاء</small><h1>تقييم الموسم العام</h1><div>${esc(session.seasonName||session.year||'')}</div></div><form id="f"><div class="card"><div class="q"><label>اسم الموسم</label><input name="seasonName" value="${esc(session.seasonName||session.year||'')}" readonly></div></div>
<div class="card"><div class="sec">تقييم مجلس اللطم</div><b>أولاً: الرادود والأداء</b>${rate('radoodPerformance','1. كيف تقيّم أداء الرواديد بشكل عام خلال الموسم؟')}${rate('radoodVariety','2. كيف تقيّم تنوع الرواديد المشاركين؟')}${rate('radoodChoice','3. هل كان اختيار الرواديد موفقًا؟')}${txt('bestRadood','4. من الرادود الأكثر تميزًا خلال الموسم؟')}<div class="q"><label>5. هل هناك رادود تتمنى مشاركته في الموسم القادم؟</label><div class="choice"><label><input type="radio" name="wantedRadood" value="نعم" onchange="wanted.style.display='block'"><span>نعم</span></label><label><input type="radio" name="wantedRadood" value="لا" onchange="wanted.style.display='none'"><span>لا</span></label></div><input id="wanted" name="wantedRadoodName" type="text" placeholder="من هو؟" style="display:none;margin-top:8px"></div><div class="q"><label>6. اختر أفضل 3 رواديد شاركوا في الهيئة</label><div class="checks">${RADOODS.map(n=>`<label><input type="checkbox" name="top3" value="${n}"> ${n}</label>`).join('')}</div><div class="hint">يمكن اختيار 3 فقط.</div></div></div>
<div class="card"><div class="sec">ثانيًا: القصائد والمحتوى</div>${rate('poemsLevel','1. كيف تقيّم مستوى القصائد بشكل عام؟')}${rate('poemsContent','2. كيف تقيّم كلمات ومضامين القصائد؟')}${rate('poemsVariety','3. هل كان هناك تنوع كافٍ في القصائد؟')}${yesno('tunesRepeated','4. هل لاحظت تكرارًا في الأطوار؟')}${txt('bestPoem','5. ما القصيدة الأكثر تأثيرًا فيك خلال الموسم؟')}</div>
<div class="card"><div class="sec">ثالثًا: الأطوار والتفاعل</div>${rate('tunesVariety','1. كيف تقيّم تنوع الأطوار المستخدمة؟')}${rate('tunesFit','2. هل كانت الأطوار مناسبة لأجواء كل ليلة ومناسبتها؟')}${rate('audienceInteraction','3. كيف تقيّم تفاعل الجمهور مع الرادود؟')}<div class="q"><label>4. هل كان إيقاع اللطم مناسبًا أم بطيئًا؟</label><select name="latmPace"><option value="">اختر</option><option>مناسب</option><option>بطيء</option><option>سريع</option></select></div>${txt('preferredTunes','5. ما نوع الأطوار التي تفضل وجودها بصورة أكبر؟')}</div>
<div class="card"><div class="sec">رابعًا: الصوت والمكان</div>${rate('voiceClarity','1. كيف تقيّم وضوح صوت الرادود؟')}${rate('speakers','2. كيف تقيّم توزيع السماعات داخل المجلس؟')}<div class="q"><label>3. هل كان مستوى الصوت مناسبًا أم مرتفعًا/منخفضًا؟</label><select name="soundLevel"><option value="">اختر</option><option>مناسب</option><option>مرتفع</option><option>منخفض</option></select></div>${rate('ac','4. كيف تقيّم التكييف والتهوية أثناء اللطم؟')}${rate('space','5. كيف تقيّم مساحة وترتيب مكان اللطم؟')}</div>
<div class="card"><div class="sec">خامسًا: مدة وتوقيت المجلس</div>${rate('duration','1. هل مدة مجلس اللطم مناسبة؟')}<div class="q"><label>2. هل تفضل أن يكون مجلس اللطم أطول، أقصر، أم كما هو؟</label><select name="durationPref"><option value="">اختر</option><option>أطول</option><option>أقصر</option><option>كما هو</option></select></div></div>
<div class="card"><div class="sec">سادسًا: التقييم النهائي</div>${rate('muharram','1. كيف تقيّم مجالس اللطم في محرم بشكل عام؟')}${rate('safar','2. كيف تقيّم مجالس اللطم في صفر بشكل عام؟')}${txt('bestNight','3. ما أفضل ليلة لطم حضرتها خلال الموسم؟ ولماذا؟')}${txt('likedMost','4. ما أكثر شيء أعجبك في مجالس اللطم هذا الموسم؟')}${txt('needsDevelopment','5. ما أكثر شيء يحتاج إلى تطوير؟')}${txt('keepNext','6. ما الشيء الذي تتمنى المحافظة عليه في الموسم القادم؟')}</div><button class="submit" type="submit">إرسال التقييم</button></form>`;
const boxes=[...document.querySelectorAll('input[name=top3]')];boxes.forEach(b=>b.onchange=()=>{if(boxes.filter(x=>x.checked).length>3){b.checked=false;alert('يمكن اختيار 3 رواديد فقط.')}});f.onsubmit=submit;}
function voterId(){let v=localStorage.getItem('season_voter_id');if(!v){v=(self.crypto&&crypto.randomUUID)?crypto.randomUUID():'v_'+Date.now()+'_'+Math.random().toString(36).slice(2);localStorage.setItem('season_voter_id',v)}return v}async function submit(e){e.preventDefault();const fd=new FormData(f),a={};for(const [k,v] of fd){if(k==='top3'){(a.top3||(a.top3=[])).push(v)}else a[k]=v}a.top3=a.top3||[];if(a.top3.length!==3){alert('يرجى اختيار أفضل 3 رواديد.');return}const btn=f.querySelector('.submit');btn.disabled=true;btn.textContent='جارٍ الإرسال…';const vid=voterId(),rid=id+'_'+vid;try{await db.collection('seasonEvalResponses').doc(rid).set({sessionId:id,seasonName:String(session.seasonName||session.year||''),voterId:vid,answers:a,createdAt:new Date().toISOString()});localStorage.setItem('season_eval_'+id,'1');state('✅','شكرًا لمشاركتك','تم استلام تقييمك بنجاح.')}catch(x){console.error(x);if(x&&x.code==='permission-denied'){localStorage.setItem('season_eval_'+id,'1');state('✅','تم التقييم مسبقًا','تم تسجيل مشاركة من هذا الجهاز لهذا الموسم من قبل.');return}alert('تعذّر إرسال التقييم. حاول مرة أخرى.');btn.disabled=false;btn.textContent='إرسال التقييم'}}
async function init(){id=new URLSearchParams(location.search).get('s');if(!id){state('⚠️','رابط غير صالح','معرّف الاستمارة غير موجود.');return}if(localStorage.getItem('season_eval_'+id)){state('✅','تم التقييم مسبقًا','شكرًا لك، تم تسجيل مشاركتك من هذا الجهاز.');return}try{firebase.initializeApp(FB_CONFIG);db=firebase.firestore();const d=await db.collection('seasonEvalSessions').doc(id).get();if(!d.exists){state('⚠️','الرابط غير موجود','قد يكون الرابط غير صحيح.');return}session=d.data();if(session.closed){state('🔒','التقييم مغلق','انتهت فترة استقبال التقييمات لهذا الموسم.');return}render()}catch(e){console.error(e);state('⚠️','تعذّر الاتصال','حاول مرة أخرى لاحقًا.')}}init();
</script></body></html>
